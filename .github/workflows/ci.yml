# Class: tool in TypeScript (npm libraries and apps).
# Copy to .github/workflows/ci.yml in the repo.
#
# The pin after "@" must be a full 40-character commit SHA of alawein/.github.
# To update it: find the new SHA (gh api repos/alawein/.github/commits/main --jq .sha),
# replace all pins in this file at once, and open a PR. Steps are in docs/ci.md, "Bump a pin".
#
# Required checks for the ruleset: markdown-lint, link-check, actionlint, pr-title, node-ci

name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run-markdown-lint:
    uses: alawein/.github/.github/workflows/lint-markdown.yml@ebdb5b18e4e03a0a9a91ffdd4374dac8edf2ff6f # reviewed main

  run-link-check:
    uses: alawein/.github/.github/workflows/check-links.yml@ebdb5b18e4e03a0a9a91ffdd4374dac8edf2ff6f # reviewed main

  run-actionlint:
    uses: alawein/.github/.github/workflows/lint-actions.yml@ebdb5b18e4e03a0a9a91ffdd4374dac8edf2ff6f # reviewed main

  run-pr-title:
    permissions:
      pull-requests: read
    uses: alawein/.github/.github/workflows/pr-title.yml@ebdb5b18e4e03a0a9a91ffdd4374dac8edf2ff6f # reviewed main

  run-node-ci:
    uses: alawein/.github/.github/workflows/node-ci.yml@ebdb5b18e4e03a0a9a91ffdd4374dac8edf2ff6f # reviewed main
    with:
      node-version: "22.23.2"

  # Gate jobs: a called job reports as "<caller job> / <called job>", so these carry the exact
  # check names the ruleset requires.
  markdown-lint:
    needs: [run-markdown-lint]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require success
        env:
          RESULT: ${{ needs.run-markdown-lint.result }}
        run: test "$RESULT" = "success"

  link-check:
    needs: [run-link-check]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require success
        env:
          RESULT: ${{ needs.run-link-check.result }}
        run: test "$RESULT" = "success"

  actionlint:
    needs: [run-actionlint]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require success
        env:
          RESULT: ${{ needs.run-actionlint.result }}
        run: test "$RESULT" = "success"

  pr-title:
    needs: [run-pr-title]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      # Only the actual main-push event may omit PR-title evaluation.
      - name: Require success or eligible main-push skip
        env:
          RESULT: ${{ needs.run-pr-title.result }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          [ "$RESULT" = "success" ] || {
            [ "$RESULT" = "skipped" ] && [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]
          }

  node-ci:
    needs: [run-node-ci]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require success
        env:
          RESULT: ${{ needs.run-node-ci.result }}
        run: test "$RESULT" = "success"


  schema-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.2"
          cache: npm
      - run: npm ci
      - run: npm run validate:schema
      - name: Report production dependency audit
        continue-on-error: true
        run: npm audit --omit=dev
