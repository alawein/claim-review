name: Publish npm on tag
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'alawein/claim-review'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.23.2"
      - name: Install pinned npm with trusted publishing support
        run: npm install --global npm@12.2.0
      - name: Require released version on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node -e 'const p=require("./package.json"); if(process.env.TAG!=="v"+p.version) process.exit(1)'
          test "$(npm --version | cut -d. -f1)" -ge 11
      - run: npm ci
      - run: npm run check
      - run: npm run validate:schema
      - run: npx playwright install --with-deps
      - run: npm run test:browser
      - run: npm pack
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: claim-review-*.tgz
      - name: Publish using trusted publisher with provenance
        run: npm publish claim-review-*.tgz --access public --provenance
